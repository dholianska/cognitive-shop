resources:
- deployment.yaml
- service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: aggregator-env
  literals:
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY=in_memory
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - HTTP_PORTS=8080
    - services__orders-api__http__0=http://orders-api:8080
    - services__catalog-api__http__0=http://catalog-api:8080
    - services__reviews-api__http__0=http://reviews-api:8080
    - Jwt__Issuer=cognitive-shop-auth
    - Jwt__Audience=cognitive-shop
    - Jwt__SecretKey=cognitive-shop-dev-signing-key-0123456789-change-me
    - IdentityServer__Authority=http://localhost:5100
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    - OTEL_SERVICE_NAME=aggregator
    - ASPNETCORE_URLS=http://+:8080;

secretGenerator:
- name: aggregator-secrets
  envs:
  - .aggregator.secrets
