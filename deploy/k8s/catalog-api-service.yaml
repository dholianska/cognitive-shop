apiVersion: v1
kind: Service
metadata:
  name: catalog-api            # DNS-ім'я: http://catalog-api
spec:
  type: ClusterIP              # доступний лише всередині кластера
  selector:
    app: catalog-api
  ports:
    - port: 80                 # порт сервісу
      targetPort: 8080         # порт контейнера