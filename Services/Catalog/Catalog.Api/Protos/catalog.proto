
syntax = "proto3";

option csharp_namespace = "Catalog.Grpc";

package catalog;

// Читання даних каталогу для внутрішніх сервісів (Aggregator)
service CatalogService {
  // Картка одного товару. NotFound, якщо товару немає
  rpc GetProduct (GetProductRequest) returns (ProductReply);

  // Пакетне читання: відсутні товари пропускаються
  rpc GetProductsByIds (GetProductsByIdsRequest) returns (ProductsReply);
}

message GetProductRequest {
  int32 id = 1;
}

message GetProductsByIdsRequest {
  repeated int32 ids = 1;
}

message ProductReply {
  int32 id = 1;
  string name = 2;
  string sku = 3;
  double price = 4;
  int32 available_stock = 5;
  optional string description = 6;
  optional string manufacturer = 7;
  repeated string categories = 8;
}

message ProductsReply {
  repeated ProductReply products = 1;
}
